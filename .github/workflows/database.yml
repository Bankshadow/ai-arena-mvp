# Push Drizzle schema to Postgres when db/ changes or on manual dispatch.
# Add DATABASE_URL in GitHub → Settings → Secrets and variables → Actions.

name: Database

on:
  push:
    branches: [main, master]
    paths:
      - "db/**"
      - "drizzle.config.ts"
      - ".github/workflows/database.yml"
  workflow_dispatch:

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Push schema to Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in repository secrets."
            exit 1
          fi
          npm run db:push

  seed-challenge:
    runs-on: ubuntu-latest
    needs: push-schema
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Seed challenge (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed
